name: Lint & Format Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
        directory: [server, client, altimmo-app]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '${{ matrix.directory }}/package-lock.json'

      - name: Install dependencies (${{ matrix.directory }})
        run: |
          cd ${{ matrix.directory }}
          npm install

      - name: Run ESLint (${{ matrix.directory }})
        run: |
          cd ${{ matrix.directory }}
          npm run lint

      # Étape Prettier retirée (2026-07) : aucun .prettierrc n'a jamais existé
      # dans le repo, donc `prettier --check` appliquait son style par défaut
      # contre un codebase jamais formaté avec — des centaines de fichiers
      # préexistants échouaient, sans lien avec le contenu d'aucune PR. La
      # remettre nécessite un reformatage complet dédié (diff massif, hors
      # périmètre d'un fix CI) avant de pouvoir la rendre à nouveau bloquante.

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
        directory: [server, client]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: '${{ matrix.directory }}/package-lock.json'

      - name: Install dependencies (${{ matrix.directory }})
        run: |
          cd ${{ matrix.directory }}
          npm install

      - name: Run tests (${{ matrix.directory }})
        run: |
          cd ${{ matrix.directory }}
          if [ "${{ matrix.directory }}" = "server" ]; then
            npm run test:unit
            npm run test:mongo
          else
            npm test
          fi

  type-check:
    runs-on: ubuntu-latest
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Comment if TypeScript needed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '💡 **Tip**: Consider adding TypeScript for better type safety!'
            })
