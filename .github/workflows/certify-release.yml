name: Release certification (Linux)

# F-U2.17 — Certification reproductible de la porte de release sur Linux :
# `certify:release` (architecture, lint, tests unitaires et MongoDB du serveur,
# lint/tests/build du client, contrôles mobiles + expo-doctor + export) et la
# campagne Playwright complète sur build de production. Aucun déploiement,
# aucune publication, aucun secret : les tests tournent sur des bases
# éphémères (mongodb-memory-server) avec les identifiants externes neutralisés
# (server/test-utils/safeTestEnv.js) et le garde réseau de test.
on:
  push:
    branches: ['certification/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: certify-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Version exacte (pas de « 20.x » flottant) pour une exécution reproductible.
  NODE_VERSION: '20.20.2'

jobs:
  certify-release:
    name: certify:release (Node 20, Linux)
    runs-on: ubuntu-24.04
    # Durée locale mesurée : ~2 h 45 ; plafond GitHub : 6 h par job.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Reject tracked credentials
        shell: bash
        run: |
          matches=$(git ls-files \
            | grep -Ei '(^|/)\.env($|\.)|client_secret|service-account|credentials\.json|\.jks$|\.keystore$|\.p8$|\.p12$' \
            | grep -Eiv '(^|/)\.env\.(example|sample)$' || true)
          if [ -n "$matches" ]; then
            echo "Fichiers d'identifiants suivis par Git :"; echo "$matches"; exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            client/package-lock.json
            altimmo-app/package-lock.json

      # Binaire mongod téléchargé par mongodb-memory-server (tests MongoDB).
      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - name: Install dependencies from lockfiles
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm ci --no-audit --no-fund --prefix server
          npm ci --no-audit --no-fund --prefix client
          npm ci --no-audit --no-fund --prefix altimmo-app

      - name: Runner resources
        run: |
          node -v; npm -v; nproc; free -h; df -h .

      - name: certify:release
        shell: bash
        run: |
          set -o pipefail
          mkdir -p certification-logs
          npm run certify:release 2>&1 | tee certification-logs/certify-release.log

      - name: Upload certification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certify-release-logs
          path: certification-logs/
          retention-days: 30

  e2e-production:
    name: Playwright E2E (build de production)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Cache MongoDB binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('server/package-lock.json') }}

      - name: Install dependencies from lockfiles
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund --prefix server
          npm ci --no-audit --no-fund --prefix client

      - name: Install Playwright browser
        working-directory: client
        run: npx playwright install --with-deps chromium

      # webServer (client/playwright.config.js) : next build de production isolé
      # (client/.next-e2e, NEXT_E2E_BUILD=1) + next start, backend Express sur
      # MongoMemoryReplSet éphémère, prestataire de paiement factice local.
      - name: Playwright (96 scénarios, desktop + mobile)
        working-directory: client
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            client/playwright-report/
            client/test-results/
          retention-days: 30
