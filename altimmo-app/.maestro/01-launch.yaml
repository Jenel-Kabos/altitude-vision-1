# MOB-E2E-2 — ce flow suppose que `.maestro/mob-e2e-prelaunch.sh` a déjà été
# exécuté juste avant (force-stop + lancement par deep-link direct vers
# MainActivity + dissolution déterministe du tooltip natif "developer menu",
