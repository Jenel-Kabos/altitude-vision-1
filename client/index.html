<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════════════════
         SEO META TAGS
    ═══════════════════════════════════════════════════════ -->
    <title>Altitude-Vision — Agence de Communication & Courtage à Brazzaville</title>

    <meta name="description" content="Altitude-Vision — Agence de communication & courtage à Brazzaville. Immobilier de luxe, événementiel haut de gamme et stratégie de communication." />
    <meta name="keywords"    content="immobilier Brazzaville, agence événementielle Congo, communication digitale, Altimmo, Mila Events, Altcom" />
    <meta name="author"      content="Altitude-Vision" />
    <meta name="robots"      content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title"       content="Altitude-Vision — Agence de Communication & Courtage" />
    <meta property="og:description" content="Trois pôles d'expertise en synergie : immobilier, événementiel et communication." />
    <meta property="og:type"        content="website" />
    <meta property="og:locale"      content="fr_CG" />
    <meta property="og:url"         content="https://altitudevision.agency/" />
    <meta property="og:image"       content="https://altitudevision.agency/og-default.jpg" />
    <meta property="og:site_name"   content="Altitude-Vision" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Altitude-Vision — Agence de Communication & Courtage" />
    <meta name="twitter:description" content="Trois pôles d'expertise en synergie : immobilier, événementiel et communication." />
    <meta name="twitter:image"       content="https://altitudevision.agency/og-default.jpg" />

    <!-- ═══════════════════════════════════════════════════════
         PERFORMANCE — Préconnexions réseau

         ⚠️  Google recommande MAX 4 preconnect.
         Au-delà, le navigateur ouvre trop de connexions TCP
         simultanées → congestion réseau → LCP dégradé.

         RÈGLE : preconnect uniquement pour les origines
         critiques au-dessus du fold (visible sans scroll).
         Pour les autres : dns-prefetch suffit (plus léger).
    ═══════════════════════════════════════════════════════ -->

    <!-- 1. Google Fonts — bloque le rendu si absent → preconnect obligatoire -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 2. Unsplash — image hero slide 0 page d'accueil → critique LCP -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />

    <!-- 3. Cloudinary — images des biens immobiliers (chargées juste après le hero) -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />

    <!-- DNS-prefetch pour les origines secondaires (moins critique) -->
    <link rel="dns-prefetch" href="https://altitude-vision.onrender.com" />
    <link rel="dns-prefetch" href="https://i.pinimg.com" />
    <link rel="dns-prefetch" href="https://plus.unsplash.com" />

    <!-- ═══════════════════════════════════════════════════════
         PRELOAD IMAGE HERO — LCP page d'accueil uniquement

         ✅ On ne preload QUE l'image de la page d'accueil (/).
            Les images des pages /altimmo, /mila-events, /altcom
            sont gérées par fetchpriority="high" dans leurs
            HeroSlider respectifs — ce qui est suffisant et évite
            la compétition réseau qui dégradait le LCP à 8,7s.

         Avant (4 preloads) : les 4 images se battaient pour
            la bande passante → toutes arrivaient tard → LCP 8,7s
         Après (1 preload)  : l'image de l'accueil arrive vite,
            les autres se chargent en background → LCP ↓
    ═══════════════════════════════════════════════════════ -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1507089947368-19c1da9775ae?auto=format&fit=crop&w=1600&q=80"
      fetchpriority="high"
    />

    <!-- ═══════════════════════════════════════════════════════
         GOOGLE FONTS — Chargement NON BLOQUANT
         media="print" + onload → charge en arrière-plan
         display=swap → texte visible immédiatement
         Gain : -450ms sur les requêtes bloquantes.
    ═══════════════════════════════════════════════════════ -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      />
    </noscript>

    <!-- ═══════════════════════════════════════════════════════
         CSS CRITIQUE INLINE — polices de secours
         Évite le FOIT (Flash Of Invisible Text).
    ═══════════════════════════════════════════════════════ -->
    <style>
      body {
        font-family: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      h1, h2, h3, .serif {
        font-family: 'Cormorant Garamond', 'Georgia', 'Times New Roman', serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
