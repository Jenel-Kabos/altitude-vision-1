<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════════════════
         SEO META TAGS
    ═══════════════════════════════════════════════════════ -->
    <title>Altitude-Vision — Agence de Communication & Courtage à Brazzaville</title>

    <meta name="description" content="Altitude-Vision — Agence de communication & courtage à Brazzaville. Immobilier de luxe, événementiel haut de gamme et stratégie de communication." />
    <meta name="keywords"    content="immobilier Brazzaville, agence événementielle Congo, communication digitale, Altimmo, Mila Events, Altcom" />
    <meta name="author"      content="Altitude-Vision" />
    <meta name="robots"      content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title"       content="Altitude-Vision — Agence de Communication & Courtage" />
    <meta property="og:description" content="Trois pôles d'expertise en synergie : immobilier, événementiel et communication." />
    <meta property="og:type"        content="website" />
    <meta property="og:locale"      content="fr_CG" />
    <meta property="og:url"         content="https://altitudevision.agency/" />
    <meta property="og:image"       content="https://altitudevision.agency/og-default.jpg" />
    <meta property="og:site_name"   content="Altitude-Vision" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Altitude-Vision — Agence de Communication & Courtage" />
    <meta name="twitter:description" content="Trois pôles d'expertise en synergie : immobilier, événementiel et communication." />
    <meta name="twitter:image"       content="https://altitudevision.agency/og-default.jpg" />

    <!-- ═══════════════════════════════════════════════════════
         PERFORMANCE — Préconnexions réseau
         Établit la connexion TCP/TLS AVANT que le navigateur
         en ait besoin → gain 200-400ms sur le LCP.
    ═══════════════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <!-- Pinterest CDN pour HeroSliderMila (2 images viennent de i.pinimg.com) -->
    <link rel="preconnect" href="https://i.pinimg.com" crossorigin />
    <link rel="dns-prefetch" href="https://altitude-vision.onrender.com" />
    <!-- Unsplash+ CDN pour HeroSliderAltcom (images premium) -->
    <link rel="dns-prefetch" href="https://plus.unsplash.com" />

    <!-- ═══════════════════════════════════════════════════════
         PRELOAD IMAGES HERO — LCP critique

         Principe : le navigateur commence à télécharger ces images
         AVANT même que React soit chargé.
         Sans preload : HTML → JS React → rendu slider → découverte image → téléchargement
         Avec preload : HTML → téléchargement immédiat en parallèle du JS

         ⚠️  RÈGLE : ne preloader QUE la 1ère image de chaque slider
             (index 0), celle affichée à l'arrivée sur la page.
             Les autres se chargent en lazy via loading="lazy".

         ⚠️  IMPORTANT : si tu changes l'ordre des images dans
             un fichier HeroSlider*.jsx, mets à jour l'URL ici.
    ═══════════════════════════════════════════════════════ -->

    <!--
      PAGE D'ACCUEIL (/) — HeroSlider.jsx, slide 0
      Image : photo-1507089947368 (appartement moderne)
    -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1507089947368-19c1da9775ae?auto=format&fit=crop&w=1600&q=80"
      fetchpriority="high"
    />

    <!--
      PAGE ALTIMMO (/altimmo) — HeroSliderAlt.jsx, slide 0
      Image : photo-1600596542815 (villa moderne)
      Chargée seulement sur /altimmo → preload conditionnel non possible en HTML statique.
      On la preload quand même car c'est la page principale du site.
    -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?q=80&w=1175&auto=format&fit=crop"
      fetchpriority="high"
    />

    <!--
      PAGE MILA EVENTS (/mila-events) — HeroSliderMila.jsx, slide 0
      Image : photo-1735679356705 (événement d'entreprise)
      Note : preconnect vers images.unsplash.com déjà déclaré ci-dessus.
    -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1735679356705-7c06b780c7a4?q=80&w=1460&auto=format&fit=crop"
      fetchpriority="high"
    />

    <!--
      PAGE ALTCOM (/altcom) — HeroSliderAltcom.jsx, slide 0
      Image : photo-1517245386807 (communication digitale)
      Vient de plus.unsplash.com (Unsplash+, domaine différent).
    -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1517245386807-bb43f82c33c4?q=80&w=2070&auto=format&fit=crop"
      fetchpriority="high"
    />

    <!-- ═══════════════════════════════════════════════════════
         GOOGLE FONTS — Chargement NON BLOQUANT

         media="print" + onload="this.media='all'" :
         → charge en arrière-plan sans bloquer le rendu
         → display=swap évite le FOIT (Flash Of Invisible Text)
         Gain estimé : -450ms sur les requêtes bloquantes.
    ═══════════════════════════════════════════════════════ -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      />
    </noscript>

    <!-- ═══════════════════════════════════════════════════════
         CSS CRITIQUE INLINE — polices de secours
         Affiche le texte immédiatement avec une police système
         pendant que Cormorant/Outfit se chargent.
         Évite le FOIT (Flash Of Invisible Text).
    ═══════════════════════════════════════════════════════ -->
    <style>
      body {
        font-family: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif;
      }
      h1, h2, h3, .serif {
        font-family: 'Cormorant Garamond', 'Georgia', 'Times New Roman', serif;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
