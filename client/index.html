<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Altitude-Vision — Agence de Communication & Courtage à Brazzaville</title>
    <meta name="description" content="Altitude-Vision — Agence de communication & courtage à Brazzaville. Immobilier de luxe, événementiel haut de gamme et stratégie de communication." />
    <meta name="keywords"    content="immobilier Brazzaville, agence événementielle Congo, communication digitale, Altimmo, Mila Events, Altcom" />
    <meta name="author"      content="Altitude-Vision" />
    <meta name="robots"      content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title"       content="Altitude-Vision — Agence de Communication & Courtage" />
    <meta property="og:description" content="Trois pôles d'expertise en synergie : immobilier, événementiel et communication." />
    <meta property="og:type"        content="website" />
    <meta property="og:locale"      content="fr_CG" />
    <meta property="og:url"         content="https://altitudevision.agency/" />
    <meta property="og:image"       content="https://altitudevision.agency/og-default.jpg" />
    <meta property="og:site_name"   content="Altitude-Vision" />

    <!-- Twitter Card -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:title"       content="Altitude-Vision — Agence de Communication & Courtage" />
    <meta name="twitter:description" content="Trois pôles d'expertise en synergie : immobilier, événementiel et communication." />
    <meta name="twitter:image"       content="https://altitudevision.agency/og-default.jpg" />

    <!-- ═══════════════════════════════════════════════════════
         PRECONNECT — Max 4, origines critiques uniquement.

         Leçon du rapport PageSpeed (image 7) :
         - res.cloudinary.com avec crossorigin="" → "Préconnexion inutilisée"
           CAUSE : les images Cloudinary sont des requêtes "no-cors"
           (balise <img>), pas des requêtes CORS. Le crossorigin ne s'applique
           que pour fetch/XHR/fonts. On retire crossorigin sur Cloudinary.
         - Google suggère d'ajouter altitude-vision.onrender.com (+300ms).
           On le passe de dns-prefetch à preconnect.
    ═══════════════════════════════════════════════════════ -->

    <!-- 1 & 2 : Google Fonts — critique, bloque les polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- 3 : Unsplash — image hero LCP page d'accueil -->
    <link rel="preconnect" href="https://images.unsplash.com" />

    <!-- 4 : Render backend — API calls démarrent dès React chargé (+300ms selon PageSpeed) -->
    <link rel="preconnect" href="https://altitude-vision.onrender.com" />

    <!-- DNS-prefetch pour les origines secondaires -->
    <!-- Cloudinary : pas de crossorigin (images = requêtes no-cors) -->
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://i.pinimg.com" />
    <link rel="dns-prefetch" href="https://plus.unsplash.com" />

    <!-- ═══════════════════════════════════════════════════════
         PRELOAD image hero page d'accueil — LCP critique
         Version 480w pour mobile (375px d'écran).
         Le navigateur choisira la bonne taille via srcset dans HeroSlider.jsx.
    ═══════════════════════════════════════════════════════ -->
    <link
      rel="preload"
      as="image"
      href="https://images.unsplash.com/photo-1507089947368-19c1da9775ae?auto=format&fit=crop&w=480&q=80"
      imagesrcset="https://images.unsplash.com/photo-1507089947368-19c1da9775ae?auto=format&fit=crop&w=480&q=80 480w,
                   https://images.unsplash.com/photo-1507089947368-19c1da9775ae?auto=format&fit=crop&w=800&q=80 800w,
                   https://images.unsplash.com/photo-1507089947368-19c1da9775ae?auto=format&fit=crop&w=1600&q=80 1600w"
      imagesizes="(max-width: 640px) 480px, (max-width: 1024px) 800px, 1600px"
      fetchpriority="high"
    />

    <!-- ═══════════════════════════════════════════════════════
         GOOGLE FONTS — Chargement non bloquant
         media="print" + onload → charge en arrière-plan
         Le CSS Tailwind (index-DEk2g8-5.css) est inévitable
         mais les polices ne doivent pas s'y ajouter.
    ═══════════════════════════════════════════════════════ -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap"
    />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap"
    />
    <noscript>
      <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Outfit:wght@300;400;500;600;700;800&display=swap"
      />
    </noscript>

    <!-- CSS critique inline — polices de secours (évite FOIT) -->
    <style>
      body { font-family: 'Outfit', 'Segoe UI', system-ui, -apple-system, sans-serif; }
      h1, h2, h3 { font-family: 'Cormorant Garamond', 'Georgia', serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
