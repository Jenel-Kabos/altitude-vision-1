# netlify.toml

# ═══════════════════════════════════════════════════════════════
# BUILD — Next.js 15 (App Router)
# ═══════════════════════════════════════════════════════════════
[build]
  base    = "client"
  command = "npm run build:next"
  publish = ".next"

[build.environment]
  NODE_VERSION = "20"

# Plugin Netlify pour Next.js (SSR, ISR, App Router)
[[plugins]]
  package = "@netlify/plugin-nextjs"

# ═══════════════════════════════════════════════════════════════
# CACHE HEADERS
# Les assets Next.js ont un hash dans leur nom — cache 1 an sans risque
# ═══════════════════════════════════════════════════════════════

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images statiques dans /public (cache 30 jours)
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# Favicon (cache 7 jours)
[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ═══════════════════════════════════════════════════════════════
# SÉCURITÉ — headers de base recommandés
# ═══════════════════════════════════════════════════════════════
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
